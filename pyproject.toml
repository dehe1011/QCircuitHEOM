[project]
name = "qcheom"
description = "A Python package for simulating quantum circuits in non-Markovian environments using free-pole hierarchical equations of motion (FP-HEOM) and tensor-train (TT) compression."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE.txt"]
keywords = ["HEOM", "open quantum systems", "non-Markovian", "quantum circuits", "tensor train"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

authors = [
    { name = "Kiyoto Nakamura" },
    { name = "Dennis Herb" },
]
dynamic = ["version", "dependencies", "optional-dependencies"]

[tool.setuptools.packages.find]
include = ["qcheom*"]

[tool.setuptools.package-data]
qcheom = ["*.mplstyle"]
"qcheom.gui" = ["logo.png"]

[tool.setuptools.exclude-package-data]
"*" = ["*.ipynb", ".ipynb_checkpoints/*"]

[tool.setuptools.dynamic]
version = {attr = "qcheom.__version__"}
dependencies = {file = "requirements/requirements.txt"}

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = "requirements/dev-requirements.txt" }
docs = { file = "requirements/doc-requirements.txt" }

[project.urls]
Homepage = "https://github.com/dehe1011/QCircuitHEOM"
Documentation = "https://qcircuitheom.readthedocs.io"
Repository = "https://github.com/dehe1011/QCircuitHEOM"
Issues = "https://github.com/dehe1011/QCircuitHEOM/issues"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = true
